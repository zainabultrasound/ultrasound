<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a5276">
  <link rel="manifest" href="/manifest.json">
  <title>Ultrasound Reporting System</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/print.css" media="print">
  <!-- Replace the old jspdf/html2canvas CDNs with these two (keep them) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
</head>
<body>
  <!-- Status Bar -->
  <div id="status-bar" class="status-bar no-print">
    <span id="sync-status">● Online</span>
    <span id="draft-indicator" style="display:none;">📝 Unsaved changes</span>
    <span id="pending-sync" style="display:none;">📤 Pending sync: 0</span>
    <span class="status-bar-separator">|</span>
    <label for="voice-language-select" class="voice-lang-label">🎙 Voice:</label>
    <select id="voice-language-select" class="voice-lang-select">
      <option value="en-US">English</option>
      <option value="hi-IN">Urdu</option>
    </select>
  </div>

  <div class="app-container">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <h1>ZUC Reports</h1>
      </div>
      <nav id="sidebar-nav"></nav>
    </aside>

    <!-- Mobile menu toggle -->
    <button id="sidebar-toggle" class="sidebar-toggle print-hide">☰</button>

    <!-- Main Content -->
    <main class="main-content" id="printable-report">
      <!-- Report Header -->
      <header class="report-header" id="report-header">
        <div class="clinic-branding">
          <img src="assets/logo.png" alt="Clinic Logo" class="clinic-logo" id="clinic-logo">
          <div class="clinic-info">
            <h2 id="clinic-name-display"></h2>
            <p id="clinic-address"></p>
            <p id="clinic-phone"></p>
          </div>
        </div>
        <div class="report-metadata">
          <div><strong>Report #:</strong> <span id="display-report-number">—</span></div>
          <div><strong>Date:</strong> <span id="display-report-date">—</span></div>
          <div><strong>Scan Type:</strong> <span id="display-scan-type">—</span></div>
          <div><strong>Status:</strong> <span id="display-report-status" class="badge">—</span></div>
        </div>
      </header>

      <!-- Patient Information -->
      <section id="patient-section" class="patient-section"></section>

      <!-- Dynamic Form -->
      <section id="dynamic-form" class="dynamic-form"></section>

      <!-- Impression -->
      <section id="impression-section" class="impression-section"></section>

      <!-- Doctor / Signature Area (print-visible) -->
      <div id="signature-area" class="signature-area print-visible-only">
        <div>
          <p><strong>Reporting Doctor:</strong> <span id="sig-doctor-name"></span></p>
          <p><strong>Qualification:</strong> <span id="sig-qualification"></span></p>
          <p><strong>Registration:</strong> <span id="sig-registration"></span></p>
        </div>
        <div class="signature-line">
          <p>________________________</p>
          <p>Doctor's Signature or Stamp</p>
        </div>
      </div>

      <!-- Action Buttons -->
      <div id="action-buttons" class="action-buttons print-hide"></div>

      <!-- History Panel -->
      <div id="history-panel" class="history-panel print-hide" style="display:none;"></div>
    </main>
  </div>

  <!-- Scripts - loaded in dependency order -->
  <script type="module" src="js/core/config.js"></script>
  <script type="module" src="js/core/events.js"></script>
  <script type="module" src="js/core/state.js"></script>
  <script type="module" src="js/services/supabase.js"></script>
  <script type="module" src="js/services/storage.js"></script>
  <script type="module" src="js/services/sync.js"></script>
  <script type="module" src="js/services/calculations.js"></script>
  <script type="module" src="js/services/report-number.js"></script>
  <script type="module" src="js/templates/registry.js"></script>
  <script type="module" src="js/components/status-bar.js"></script>
  <script type="module" src="js/components/patient-section.js"></script>
  <script type="module" src="js/components/impression-section.js"></script>
  <script type="module" src="js/components/action-buttons.js"></script>
  <script type="module" src="js/components/history-panel.js"></script>
  <script type="module" src="js/components/sidebar.js"></script>
  <script type="module" src="js/renderer.js"></script>
  <script type="module" src="js/validation.js"></script>
  <script type="module" src="js/print.js"></script>
  <script type="module" src="js/router.js"></script>
  <script type="module" src="js/app.js"></script>
  <!-- PWA Update notification (hidden by default) -->
  <div id="pwa-update-banner" style="position:fixed;bottom:16px;left:16px;right:16px;
       background:#1a5276;color:#fff;padding:12px 16px;border-radius:12px;
       box-shadow:0 4px 16px rgba(0,0,0,0.3);z-index:1000;display:none;
       justify-content:space-between;align-items:center;font-size:0.9rem;">
    <span>A new version is available.</span>
    <button id="pwa-reload-btn" style="background:#fff;color:#1a5276;border:none;
            padding:6px 14px;border-radius:8px;font-weight:600;cursor:pointer;
            margin-left:12px;transition:0.2s ease;">
      Refresh
    </button>
  </div>

  <script>
    // Service worker registration and update handling
    if ('serviceWorker' in navigator) {
      const base = '/';
      const swUrl = base + 'service-worker.js';

      window.addEventListener('load', async () => {
        try {
          const reg = await navigator.serviceWorker.register(swUrl, { scope: base });
          console.log('[SW] Registered:', reg.scope);

          // Check for waiting worker (on first visit or after update)
          if (reg.waiting) {
            showUpdateBanner();
          }

          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && reg.waiting) {
                showUpdateBanner();
              }
            });
          });

          // Listen for messages from the SW (e.g., NEW_VERSION)
          navigator.serviceWorker.addEventListener('message', event => {
            if (event.data && event.data.type === 'NEW_VERSION') {
              showUpdateBanner();
            }
          });

        } catch (err) {
          console.error('[SW] Registration failed:', err);
        }
      });

      function showUpdateBanner() {
        const banner = document.getElementById('pwa-update-banner');
        if (banner) {
          banner.style.display = 'flex';
          document.getElementById('pwa-reload-btn').addEventListener('click', () => {
            // Tell the waiting SW to skipWaiting and reload page
            navigator.serviceWorker.controller?.postMessage('skipWaiting');
            window.location.reload();
          }, { once: true });
        }
      }
    }
  </script>
  <style>
/* =========================================
   Compact Premium Voice UI
========================================= */

.voice-lang-label {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;

    padding: 0.28rem 0.65rem;
    margin-left: 0.45rem;

    border-radius: 999px;

    background: linear-gradient(
        135deg,
        rgba(0, 183, 255, 0.14),
        rgba(0, 119, 255, 0.06)
    );

    border: 1px solid rgba(0, 183, 255, 0.18);

    color: #dff7ff;

    font-size: 0.76rem;
    font-weight: 600;
    letter-spacing: 0.2px;

    white-space: nowrap;

    box-shadow:
        0 2px 8px rgba(0, 183, 255, 0.10),
        inset 0 1px 0 rgba(255,255,255,0.04);

    backdrop-filter: blur(8px);

    transition:
        transform 0.18s ease,
        box-shadow 0.22s ease,
        border-color 0.22s ease;
}

.voice-lang-label:hover {
    transform: translateY(-1px);

    border-color: rgba(0, 183, 255, 0.4);

    box-shadow:
        0 5px 14px rgba(0, 183, 255, 0.18),
        inset 0 1px 0 rgba(255,255,255,0.06);
}


/* =========================================
   Compact Voice Select
========================================= */

.voice-lang-select {
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;

    margin-left: 0.4rem;
    padding: 0.32rem 1.8rem 0.32rem 0.65rem;

    border-radius: 10px;

    border: 1px solid rgba(0, 183, 255, 0.22);

    background:
        linear-gradient(
            145deg,
            rgba(20, 27, 40, 0.96),
            rgba(10, 15, 25, 0.92)
        );

    color: #ffffff;

    font-size: 0.74rem;
    font-weight: 600;

    cursor: pointer;
    outline: none;

    min-width: 88px;

    white-space: nowrap;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.15),
        inset 0 1px 0 rgba(255,255,255,0.03);

    transition:
        all 0.22s ease;
}


/* Hover */

.voice-lang-select:hover {
    border-color: rgba(0, 183, 255, 0.45);

    box-shadow:
        0 5px 14px rgba(0, 183, 255, 0.14);

    transform: translateY(-1px);
}


/* Focus */

.voice-lang-select:focus {
    border-color: rgba(0, 183, 255, 0.65);

    box-shadow:
        0 0 0 3px rgba(0, 183, 255, 0.10),
        0 6px 16px rgba(0, 183, 255, 0.16);
}


/* Dropdown Options */

.voice-lang-select option {
    background: #101826;
    color: #ffffff;
}


/* =========================================
   Small Animated Mic Dot
========================================= */

.voice-lang-label::before {
    content: "";

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #00c3ff;

    box-shadow:
        0 0 6px rgba(0, 195, 255, 0.75);

    animation: voicePulseCompact 2s infinite ease-in-out;

    flex-shrink: 0;
}


/* =========================================
   Pulse Animation
========================================= */

@keyframes voicePulseCompact {
    0% {
        transform: scale(1);
        opacity: 0.75;
    }

    50% {
        transform: scale(1.25);
        opacity: 1;
    }

    100% {
        transform: scale(1);
        opacity: 0.75;
    }
}


/* =========================================
   Keep Status Bar Horizontal
========================================= */

.status-bar {
    display: flex;
    align-items: center;
    gap: 0.45rem;

    flex-wrap: nowrap;

    overflow-x: auto;
    overflow-y: hidden;

    scrollbar-width: thin;
}


/* Optional cleaner scrollbar */

.status-bar::-webkit-scrollbar {
    height: 5px;
}

.status-bar::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.14);
    border-radius: 999px;
}


/* =========================================
   Mobile Responsive
========================================= */

@media (max-width: 768px) {

    .voice-lang-label {
        padding: 0.24rem 0.55rem;
        font-size: 0.72rem;
    }

    .voice-lang-select {
        min-width: 78px;
        font-size: 0.7rem;

        padding:
            0.28rem
            1.6rem
            0.28rem
            0.55rem;
    }
}
  </style>
</body>
</html>
